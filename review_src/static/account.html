<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>註冊與帳號安全｜台股研究室</title><link rel="stylesheet" href="/static/portfolio.css"><script src="/static/account.js" defer></script></head>
<body><header class="top"><a class="brand" href="/portfolio">台股研究室</a><a href="/portfolio">返回研究空間</a></header><main><p class="eyebrow">帳號安全</p><h1>建立帳號，開始你的研究。</h1><p>新會員需完成 Email 與手機簡訊驗證。密碼至少 10 字元，混合字母、數字或符號。</p><div id="account-status" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="帳號功能"><button data-account-tab="login">登入</button><button data-account-tab="register">註冊</button><button data-account-tab="verify">驗證 Email</button><button data-account-tab="reset">忘記密碼</button><button data-account-tab="security">修改密碼／手機驗證</button></nav>
<div id="captcha"></div>
<section class="panel narrow account-page" id="account-login"><h2>登入</h2><form id="account-login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary">登入</button></form></section>
<section class="panel narrow account-page" id="account-register" hidden><h2>註冊免費會員</h2><p id="registration-readiness" class="subtle"></p><form id="account-register-form"><label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>密碼<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>再次輸入密碼<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="subtle">註冊不會收費。Email 用於帳號及密碼重設；驗證手機用於確認號碼持有及防止重複註冊，號碼將加密保存並交由簡訊服務商驗證。尚未完成驗證時不開放會員功能。</p><button class="primary" id="register-submit" disabled>註冊並寄出 Email 驗證碼</button></form></section>
<section class="panel narrow account-page" id="account-verify" hidden><h2>驗證 Email</h2><form id="account-verify-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>6 位驗證碼<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button class="primary">完成 Email 驗證</button><button id="resend-email" type="button">重新寄送</button></form></section>
<section class="panel narrow account-page" id="account-reset" hidden><h2>忘記密碼</h2><form id="account-forgot-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><button class="primary">寄送重設碼</button></form><hr><form id="account-reset-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>6 位重設碼<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><label>新密碼<input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>再次輸入新密碼<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button class="primary">重設密碼</button></form></section>
<section class="account-page" id="account-security" hidden><p id="signed-in-email"></p><div class="settings-grid"><section class="panel"><h2>修改密碼</h2><form id="account-change-form"><label>目前密碼<input name="current_password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密碼<input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>再次輸入新密碼<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p>修改後，所有舊登入憑證立即失效，請使用新密碼重新登入。</p><button class="primary">修改密碼</button></form></section>
<section class="panel"><h2>手機驗證</h2><p id="phone-readiness"></p><form id="account-phone-form"><label>台灣手機號碼<input name="phone" type="tel" autocomplete="tel" placeholder="09xxxxxxxx" maxlength="24" required></label><button id="phone-send" class="primary">寄送簡訊驗證碼</button></form><form id="account-phone-verify-form"><label>簡訊驗證碼<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,10}" required></label><button class="primary">完成手機驗證</button></form></section></div><p><a href="/portfolio">返回研究空間</a></p><button id="account-logout">登出</button></section>
</main></body></html>
