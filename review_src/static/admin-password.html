<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>修改密碼｜台股研究室</title><link rel="stylesheet" href="/static/portfolio.css"><link rel="stylesheet" href="/static/account-layout.css"><script src="/static/admin-password.js" defer></script></head>
<body class="admin-shell"><header class="top"><a class="brand" href="/members">台股研究室</a><a href="/members">返回後臺</a></header>
<main><section class="panel narrow"><h1>設定新密碼</h1><p id="password-status" role="status" aria-live="polite">請輸入新密碼，完成後重新登入。</p>
<form id="password-form"><label>新密碼<input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>再次輸入新密碼<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="subtle">至少 10 字，混合字母、數字或符號。</p><button class="primary">確認修改</button></form><a id="password-login" href="/members" hidden>返回後臺登入</a></section></main></body></html>
