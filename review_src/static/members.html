<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員管理｜台股研究室</title><link rel="stylesheet" href="/static/portfolio.css"><script src="/static/members.js" defer></script></head>
<body><header class="top"><a class="brand" href="/portfolio">台股研究室</a><a href="/portfolio">返回研究空間</a></header>
<main><p class="eyebrow">會員後臺</p><h1>會員與使用資格</h1><p>管理權限與會員等級分開設定。永久招待會員免付費享有進階資格，仍受服務使用規則約束。</p>
<div id="admin-status" role="status" aria-live="polite"></div>
<section id="admin-login" class="panel narrow" hidden><h2>管理員登入</h2><form id="admin-login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登入</button></form></section>
<section id="admin-workspace" hidden><form id="member-search" class="panel"><label>搜尋會員 Email<input id="member-query" type="search" maxlength="254"></label><button class="primary">搜尋</button></form><p id="member-count"></p><div id="member-list" class="settings-grid"></div><div class="actions"><button id="member-prev">上一頁</button><button id="member-next">下一頁</button></div>
<section id="member-editor" class="panel" hidden><h2 id="member-title"></h2><form id="member-change"><label>調整項目<select id="member-action"><option value="plan">会员資格</option><option value="role">管理權限（僅擁有者）</option></select></label><label>會員資格<select id="member-plan"><option value="free">免費會員</option><option value="monthly">限期進階會員</option><option value="complimentary">永久招待：進階功能免收費</option></select></label><label>限期資格到期時間（本地時間）<input id="member-expiry" type="datetime-local"></label><label>管理權限<select id="member-role"><option value="member">一般會員</option><option value="manager">會員管理員</option></select></label><label>調整原因<textarea id="member-reason" maxlength="500" required placeholder="例如：測試招待，或已核對的付款單號"></textarea></label><p class="subtle">授予資格不代表已收款，也不會自動扣款。修改現有自動續訂必須另外向金流商取消，不能只調整這裡。</p><button class="primary">儲存變更</button><button id="member-cancel" type="button">取消</button></form></section>
<section id="member-audit" class="panel" hidden><h2>會員調整紀錄</h2><div id="audit-list"></div></section></section></main></body></html>
