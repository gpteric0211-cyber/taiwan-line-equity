[project]
name = "taiwan-line-equity"
version = "0.1.0"
description = "Portable Taiwan market research, local AI, LINE and mobile portfolios"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.34,<0.35",
  "requests>=2.32,<3", "charset-normalizer>=3.4,<4", "truststore>=0.10,<0.11",
  "python-dotenv>=1.0,<2", "cryptography>=45,<47",
  "pandas>=2.2,<3", "numpy>=1.26,<2.5", "Pillow>=11,<13",
  "yfinance>=0.2.40,<0.3", "tzdata>=2025.2", "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<0.29",
    "playwright>=1.62.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["logs", "var", "models", "runtime", "legacy_archive", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["review_src", "."]
